<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadSafe Intelligence - Local Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        #map { height: 100%; width: 100%; border-radius: 0.5rem; background-color: #1e293b; min-height: 520px; }
        .pane { background-color: #1e293b; border: 1px solid #334155; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        input[list]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .leaflet-tooltip { background: #0f172a !important; border: 1px solid #334155 !important; color: #f8fafc !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 gap-4">
    <!-- HEADER -->
    <header class="flex justify-between items-center pane p-4 rounded-lg shadow-lg flex-shrink-0">
        <div>
            <h1 class="text-xl font-bold text-blue-400">RoadSafe Intelligence <span class="text-gray-400 font-normal">— Delhi-NCR Safety Command Center</span></h1>
            <p class="text-sm text-gray-400">Mode: Merged Serverless Deployment (Google Roads API Wired)</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-emerald-500/40 text-xs text-emerald-300">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>NCR Dataset Loaded</span>
            </div>
            <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-semibold text-sm transition">Export PDF</button>
        </div>
    </header>

    <!-- 3-PANE WORKSPACE -->
    <main class="grid grid-cols-12 gap-4 flex-1 min-h-0">
        
        <!-- LEFT: CONTROLS -->
        <aside class="col-span-3 pane p-4 rounded-lg flex flex-col gap-4 shadow-lg overflow-y-auto">
            <h2 class="text-sm font-bold tracking-wider text-gray-400 uppercase">Layer & Time Controls</h2>
            
            <div class="flex flex-col gap-2">
                <label class="text-sm">Regional Risk Filter:</label>
                <select id="riskFilterSelect" class="bg-slate-800 border border-slate-600 rounded p-2 text-sm
